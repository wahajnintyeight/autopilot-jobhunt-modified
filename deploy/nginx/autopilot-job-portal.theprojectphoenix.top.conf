server {
    listen 80;
    listen [::]:80;
    server_name autopilot-job-portal.theprojectphoenix.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;

    access_log /var/log/nginx/autopilot-job-portal.theprojectphoenix.top_access.log;
    error_log /var/log/nginx/autopilot-job-portal.theprojectphoenix.top_error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autopilot-job-portal.theprojectphoenix.top;

    ssl_certificate /etc/letsencrypt/live/autopilot-job-portal.theprojectphoenix.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopilot-job-portal.theprojectphoenix.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/autopilot-job-portal.theprojectphoenix.top_access.log;
    error_log /var/log/nginx/autopilot-job-portal.theprojectphoenix.top_error.log;
}
